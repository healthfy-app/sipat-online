name: Deploy production

# Manual, from main only, to the production VM (GitHub environment "production", which can require approval).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: verify
    uses: ./.github/workflows/deploy-vm.yml
    with:
      environment: production
    secrets: inherit
