name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Azure VM
    if: github.ref == 'refs/heads/main'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ vars.DEPLOY_APP_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set production variable DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set production variable DEPLOY_USER}"
          : "${DEPLOY_APP_PATH:?Set production variable DEPLOY_APP_PATH}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Set production secret DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Set production secret DEPLOY_SSH_KNOWN_HOSTS}"
          [[ "$DEPLOY_APP_PATH" == /* && "$DEPLOY_APP_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]

          key_file="$RUNNER_TEMP/sipat-online-deploy-key"
          known_hosts_file="$RUNNER_TEMP/sipat-online-known-hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_APP_PATH'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          compose=(docker compose --env-file deploy/.env.production --file deploy/compose.production.yaml)
          "${compose[@]}" up -d postgres
          "${compose[@]}" --profile tools run --rm db-init
          "${compose[@]}" up --build -d api web
          "${compose[@]}" ps
          REMOTE
