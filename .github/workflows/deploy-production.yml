name: Deploy production

# Every push to main (a merged PR, already tested by its CI) goes straight to the production VM (GitHub environment
# "production"). Run it by hand to redeploy main (run_tests to test again first), or with restore_backup=latest when
# moving to a new VM.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      restore_backup:
        description: Moving to a NEW VM? "latest" loads the last R2 backup into its empty database. Leave empty otherwise.
        required: false
        type: string
        default: ""
      run_tests:
        description: Run the tests again before the deploy (the PR already ran them).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.ref == 'refs/heads/main' && inputs.run_tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    # skipped tests are fine (the PR ran them); failed tests stop the deploy
    if: !cancelled() && github.ref == 'refs/heads/main' && contains(fromJSON('["success", "skipped"]'), needs.verify.result)
    needs: verify
    uses: ./.github/workflows/deploy-vm.yml
    # the images are signed with the workflow's OIDC identity and get a provenance attestation
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      environment: production
      restore_backup: ${{ inputs.restore_backup || '' }}
    secrets: inherit
