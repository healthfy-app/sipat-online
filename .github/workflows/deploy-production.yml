name: Deploy production

# Every push to main (a merged PR) is tested and goes to the production VM (GitHub environment "production").
# Run it by hand to redeploy main, or with restore_backup=latest when moving to a new VM.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      restore_backup:
        description: Moving to a NEW VM? "latest" loads the last R2 backup into its empty database. Leave empty otherwise.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: verify
    uses: ./.github/workflows/deploy-vm.yml
    # the images are signed with the workflow's OIDC identity and get a provenance attestation
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      environment: production
      restore_backup: ${{ inputs.restore_backup || '' }}
    secrets: inherit
