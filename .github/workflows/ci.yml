name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: .NET formatting
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SipatOnline.slnx

      - name: Check formatting
        run: dotnet format whitespace SipatOnline.slnx --verify-no-changes --no-restore

  backend:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SipatOnline.slnx

      - name: Test
        run: dotnet test SipatOnline.slnx --configuration Release --no-restore

  frontend:
    name: React and TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web/SipatOnline.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/SipatOnline.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  containers:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file Dockerfile --tag sipat-online-api:ci .

      - name: Build web image
        run: docker build --file deploy/nginx/Dockerfile --tag sipat-online-web:ci .
