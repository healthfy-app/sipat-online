name: Deploy dev

# Every push to the dev branch is tested and goes to the dev VM (GitHub environment "dev").
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      restore_backup:
        description: Moving to a NEW VM? "latest" loads the last R2 backup into its empty database. Leave empty otherwise.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: verify
    uses: ./.github/workflows/deploy-vm.yml
    # the images are signed with the workflow's OIDC identity and get a provenance attestation
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      environment: dev
      restore_backup: ${{ inputs.restore_backup || '' }}
    secrets: inherit
