name: sipat-online-production

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: 8080
  ConnectionStrings__SipatOnline: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sipat_online};Username=${POSTGRES_USER:-sipat_online};Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in deploy/.env.production}
  # the first company is optional: leave TENANT_ID, TENANT_KEY and TENANT_NAME empty and the platform starts with none (an empty ID is the zero GUID)
  SipatOnline__Tenant__Id: ${TENANT_ID:-00000000-0000-0000-0000-000000000000}
  SipatOnline__Tenant__Key: ${TENANT_KEY:-}
  SipatOnline__Tenant__Name: ${TENANT_NAME:-}
  SipatOnline__Tenant__BaseDomain: ${TENANT_BASE_DOMAIN:?Configure TENANT_BASE_DOMAIN in deploy/.env.production}
  SipatOnline__Tenant__PlatformHost: ${PLATFORM_HOST:?Configure PLATFORM_HOST (for example ops.example.com) in deploy/.env.production}
  # where the videos of the library are kept: a volume of the VM, to be backed up with the database
  SipatOnline__PlatformCatalog__StoragePath: /var/sipat/videos
  # File = volume da VM (plano B, padrao); R2 = Cloudflare R2, com os videos tocando por links assinados
  SipatOnline__VideoStorage__Provider: ${VIDEO_STORAGE_PROVIDER:-File}
  SipatOnline__VideoStorage__R2__ServiceUrl: ${R2_SERVICE_URL:-}
  SipatOnline__VideoStorage__R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
  SipatOnline__VideoStorage__R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
  SipatOnline__VideoStorage__R2__Bucket: ${R2_VIDEO_BUCKET:-}
  # true = o navegador do operador envia o original direto ao R2 (precisa da regra CORS no bucket)
  SipatOnline__VideoStorage__R2__DirectUpload: ${R2_DIRECT_UPLOAD:-false}
  # cada envio vira 720p (e 1080p se o original tiver mais de 720 linhas) na propria API (ffmpeg na imagem), um por vez e em prioridade baixa;
  # a pasta guarda o original so ate a conversao terminar
  SipatOnline__VideoConversion__Enabled: "true"
  SipatOnline__VideoConversion__WorkPath: /var/sipat/video-work
  # the owner of the platform, created on the first start (the password is only read then)
  SipatOnline__PlatformOperator__LoginIdentifier: ${PLATFORM_OPERATOR_LOGIN_IDENTIFIER:-}
  SipatOnline__PlatformOperator__DisplayName: ${PLATFORM_OPERATOR_DISPLAY_NAME:-}
  SipatOnline__PlatformOperator__Password: ${PLATFORM_OPERATOR_PASSWORD:-}
  # optional second owner, created on the first start after it is set (the password is only read then)
  SipatOnline__PlatformOperator__Additional__0__LoginIdentifier: ${PLATFORM_OPERATOR_2_LOGIN_IDENTIFIER:-}
  SipatOnline__PlatformOperator__Additional__0__DisplayName: ${PLATFORM_OPERATOR_2_DISPLAY_NAME:-}
  SipatOnline__PlatformOperator__Additional__0__Password: ${PLATFORM_OPERATOR_2_PASSWORD:-}
  SipatOnline__ForwardedHeaders__KnownProxies__0: 172.28.0.2
  # opcional: uma rede inteira de proxies confiaveis (CIDR); vazio = so o nginx acima, como hoje
  SipatOnline__ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}
  SipatOnline__BootstrapAdmin__LoginIdentifier: ${BOOTSTRAP_ADMIN_LOGIN_IDENTIFIER:-}
  SipatOnline__BootstrapAdmin__DisplayName: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
  SipatOnline__BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  # observabilidade (traces, metricas e logs por OTLP): desligada enquanto o endpoint estiver vazio.
  # Para o Grafana Cloud (camada gratis), veja deploy/CLOUDFLARE-VM.md, secao 7.
  # Para o Aspire Dashboard na propria VM (ASPIRE_DASHBOARD=true no deploy), veja deploy/PRODUCAO.md.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sipat-online-api}

# Docker keeps container logs forever by default: these cap them at 5 files of 20 MB per service,
# so a busy SIPAT week never fills the disk of the VM.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sipat_online}
      POSTGRES_USER: ${POSTGRES_USER:-sipat_online}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - data

  db-init:
    image: ${SIPAT_API_IMAGE:-sipat-online-api:production}
    logging: *default-logging
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["--initialize-database"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    networks:
      - data

  api:
    image: ${SIPAT_API_IMAGE:-sipat-online-api:production}
    logging: *default-logging
    build:
      context: ..
      dockerfile: Dockerfile
    environment: *api-environment
    volumes:
      - platform-videos:/var/sipat/videos
      - video-work:/var/sipat/video-work
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      data:
      edge:
        # fixed, so that it never takes the address 172.28.0.2 that the web container (the trusted proxy) needs
        ipv4_address: 172.28.0.3
      telemetry:

  # Aspire Dashboard: traces, logs and metrics of the API, kept in memory (a restart clears them).
  # Started only with ASPIRE_DASHBOARD=true (deploy/scripts/deploy-vm.sh). The page asks for the
  # browser token (ASPIRE_BROWSER_TOKEN) and is reached at https://ASPIRE_HOST through the web
  # container, or through an SSH tunnel to the VM's loopback (deploy/PRODUCAO.md).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    logging: *default-logging
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: BrowserToken
      # empty = the dashboard makes up a token and writes it to its log
      DASHBOARD__FRONTEND__BROWSERTOKEN: ${ASPIRE_BROWSER_TOKEN:-}
      # telemetry only arrives from the API, on the private telemetry network
      DASHBOARD__OTLP__AUTHMODE: Unsecured
      ASPIRE_DASHBOARD_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      - "127.0.0.1:18888:18888"
    expose:
      - "18889"
    restart: unless-stopped
    networks:
      telemetry:

  web:
    image: ${SIPAT_WEB_IMAGE:-sipat-online-web:production}
    logging: *default-logging
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    environment:
      # host of the Aspire Dashboard page (empty = no such page): see deploy/nginx/entrypoint.sh
      ASPIRE_HOST: ${ASPIRE_HOST:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # webroot of the Let's Encrypt HTTP-01 challenge (deploy/scripts/issue-certificates.sh)
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.28.0.2
      telemetry:

volumes:
  postgres-data:
  platform-videos:
  video-work:

networks:
  data:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # API and web -> Aspire Dashboard; its own network so no dynamic address is ever taken from edge
  telemetry:
