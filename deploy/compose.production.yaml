name: sipat-online-production

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: 8080
  ConnectionStrings__SipatOnline: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sipat_online};Username=${POSTGRES_USER:-sipat_online};Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in deploy/.env.production}
  # the first company is optional: leave TENANT_ID, TENANT_KEY and TENANT_NAME empty and the platform starts with none (an empty ID is the zero GUID)
  SipatOnline__Tenant__Id: ${TENANT_ID:-00000000-0000-0000-0000-000000000000}
  SipatOnline__Tenant__Key: ${TENANT_KEY:-}
  SipatOnline__Tenant__Name: ${TENANT_NAME:-}
  SipatOnline__Tenant__BaseDomain: ${TENANT_BASE_DOMAIN:?Configure TENANT_BASE_DOMAIN in deploy/.env.production}
  SipatOnline__Tenant__PlatformHost: ${PLATFORM_HOST:?Configure PLATFORM_HOST (for example ops.example.com) in deploy/.env.production}
  # where the videos of the library are kept: a volume of the VM, to be backed up with the database
  SipatOnline__PlatformCatalog__StoragePath: /var/sipat/videos
  # the owner of the platform, created on the first start (the password is only read then)
  SipatOnline__PlatformOperator__LoginIdentifier: ${PLATFORM_OPERATOR_LOGIN_IDENTIFIER:-}
  SipatOnline__PlatformOperator__DisplayName: ${PLATFORM_OPERATOR_DISPLAY_NAME:-}
  SipatOnline__PlatformOperator__Password: ${PLATFORM_OPERATOR_PASSWORD:-}
  SipatOnline__ForwardedHeaders__KnownProxies__0: 172.28.0.2
  SipatOnline__BootstrapAdmin__LoginIdentifier: ${BOOTSTRAP_ADMIN_LOGIN_IDENTIFIER:-}
  SipatOnline__BootstrapAdmin__DisplayName: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
  SipatOnline__BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sipat_online}
      POSTGRES_USER: ${POSTGRES_USER:-sipat_online}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - data

  db-init:
    image: sipat-online-api:production
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["--initialize-database"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    networks:
      - data

  api:
    image: sipat-online-api:production
    build:
      context: ..
      dockerfile: Dockerfile
    environment: *api-environment
    volumes:
      - aspnet-data-protection:/root/.aspnet/DataProtection-Keys
      - platform-videos:/var/sipat/videos
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      data:
      edge:
        # fixed, so that it never takes the address 172.28.0.2 that the web container (the trusted proxy) needs
        ipv4_address: 172.28.0.3

  web:
    image: sipat-online-web:production
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.28.0.2

volumes:
  postgres-data:
  aspnet-data-protection:
  platform-videos:

networks:
  data:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
