# Included in the server block AND in every location that has its own add_header:
# nginx drops the inherited add_header lines as soon as a location declares one.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Report-only first: the browser console shows what would be blocked (Media Chrome, games, R2 videos)
# without blocking anything. Switch to Content-Security-Policy once a full SIPAT ran with no reports.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: https://*.r2.cloudflarestorage.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
