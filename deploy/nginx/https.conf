server {
    listen 80 default_server;
    server_name _;

    # HTTP-01 challenge of Let's Encrypt: renewals and new company hosts keep working once HTTPS is on
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/sipat-online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sipat-online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/sipat-online-security-headers.conf;
    client_max_body_size 2m;

    location = /health {
        access_log off;
        return 200 "healthy\n";
        default_type text/plain;
    }

    # sending a video of the library: up to 250 MB, streamed to the API instead of buffered on the disk of the proxy
    location ~ ^/api/platform/catalog/(videos|courses/[0-9a-fA-F-]+/videos)$ {
        client_max_body_size 260m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/sipat-online-security-headers.conf;
        try_files $uri =404;
    }
}
