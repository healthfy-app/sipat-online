# Compresses the front-end files on the way out: the DNS is "DNS only" (no Cloudflare proxy to compress them),
# and the main script goes from ~830 KB to ~260 KB on the participants' phones.
# Only static types: API answers (JSON) stay uncompressed, so no secret in them meets compression (BREACH).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied off;
gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json;
